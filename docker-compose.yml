version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. GATEWAY (Nginx) - The Single Entry Point
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./docker/nginx
    container_name: kilosunlad-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
      - client
    networks:
      - kilosunlad-network

  # ----------------------------------------------------------------------------
  # 2. CLIENT (React + Vite) - The User Interfaces
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
    container_name: kilosunlad-client
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    networks:
      - kilosunlad-network

  # ----------------------------------------------------------------------------
  # 3. SERVER (Node.js & Express) - The Business Engine
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
    container_name: kilosunlad-server
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://app_user:AppUserPassword2026!@db:27017/kilosunlad?replicaSet=rs0&authSource=kilosunlad
      - ML_SERVICE_URL=http://ml-service:8000
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=http://localhost:3000,http://localhost
      - APPEAL_WINDOW_DAYS=15
      - PHASE1_MOCK_MODE=false
      - JWT_SECRET=super_secret_kilosunlad_jwt_key_2026_dswd_audit
    volumes:
      - upload-data:/app/uploads
    depends_on:
      db:
        condition: service_started
      replset-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_started
    networks:
      - kilosunlad-network

  # ----------------------------------------------------------------------------
  # 4. ML SERVICE (Python & FastAPI) - The AI Engine
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
    container_name: kilosunlad-ml
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - ML_ENV=development
      - SWDI_MODEL_PATH=/app/artifacts/v2/lightgbm_swdi_v2.joblib
      - MODEL_METADATA_PATH=/app/artifacts/v2/model_metadata.json
    volumes:
      - ./ml-service/artifacts:/app/artifacts
    networks:
      - kilosunlad-network

  # ----------------------------------------------------------------------------
  # 5. DATABASE (MongoDB 6.0) - The Persistence Store
  # ----------------------------------------------------------------------------
  db:
    image: mongo:6.0
    container_name: kilosunlad-db
    restart: unless-stopped
    # DECISION-006 — Single-Node Replica Set (rs0) with keyfile ownership fix.
    entrypoint: >
      bash -c '
        if [ ! -f /keyfile/mongo-keyfile ]; then
          mkdir -p /keyfile &&
          openssl rand -base64 756 | tr -d "\n" > /keyfile/mongo-keyfile &&
          chmod 0400 /keyfile/mongo-keyfile
        fi
        chown 999:999 /keyfile/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /keyfile/mongo-keyfile --bind_ip_all
      '
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin_user
      - MONGO_INITDB_ROOT_PASSWORD=RootAdminSecret2026!
      - MONGO_INITDB_DATABASE=kilosunlad
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile-data:/keyfile
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - kilosunlad-network

  # ----------------------------------------------------------------------------
  # 6. REPLICA SET INITIALIZER (One-Shot Service)
  # ----------------------------------------------------------------------------
  replset-init:
    image: mongo:6.0
    container_name: kilosunlad-replset-init
    depends_on:
      - db
    entrypoint: >
      bash -c '
        echo "Waiting for mongod...";
        until mongosh --host db:27017 --username admin_user --password RootAdminSecret2026! --authenticationDatabase admin --quiet --eval "db.adminCommand({ping: 1}).ok === 1 ? process.exit(0) : process.exit(1)" > /dev/null 2>&1; do
          sleep 2;
        done;
        echo "mongod is up. Initializing replica set...";
        mongosh --host db:27017 --username admin_user --password RootAdminSecret2026! --authenticationDatabase admin --quiet --eval "
          try {
            rs.status();
            print(\"Replica set already initialized.\");
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"db:27017\" }] });
            print(\"Replica set initialized.\");
          }
        ";
        echo "Waiting for PRIMARY election...";
        until mongosh --host db:27017 --username admin_user --password RootAdminSecret2026! --authenticationDatabase admin --quiet --eval "
          try {
            process.exit(rs.status().myState === 1 ? 0 : 1);
          } catch (e) {
            process.exit(1);
          }
        " > /dev/null 2>&1; do
          echo "  Waiting for PRIMARY...";
          sleep 2;
        done;
        echo "Replica set is PRIMARY. Done.";
      '
    networks:
      - kilosunlad-network
    restart: "no"

    # ----------------------------------------------------------------------------
  # 7. SEED INGEST (One-Shot Python Service)
  # ----------------------------------------------------------------------------
  # Runs Phase 3 Task 3.1 — ingests seed JSON files into MongoDB.
  # Invoked manually via: docker-compose run seed-ingest
  # Reads from ./data-pipeline/seeds/, connects to db:27017 over the
  # kilosunlad-network with the app_user account.
  # ----------------------------------------------------------------------------
  seed-ingest:
    profiles: ["tools"] # one-shot job: run explicitly, never on `up`
    image: python:3.10-slim
    container_name: kilosunlad-seed-ingest
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
    command: bash -c "pip install --no-cache-dir pymongo && python scripts/seed_db.py"
    networks:
      - kilosunlad-network
    restart: "no"

      # ----------------------------------------------------------------------------
  # 8. SEED VERIFY (One-Shot Python Service)
  # ----------------------------------------------------------------------------
  # Phase 3 Task 3.2 — verifies the compound index is used by the triage query.
  # Invoke manually via: docker-compose run --rm seed-verify
  # ----------------------------------------------------------------------------
  seed-verify:
    profiles: ["tools"] # one-shot job: run explicitly, never on `up`
    image: python:3.10-slim
    container_name: kilosunlad-seed-verify
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
    command: bash -c "pip install --no-cache-dir pymongo && python scripts/verify_compound_index.py"
    networks:
      - kilosunlad-network
    restart: "no"

      # ----------------------------------------------------------------------------
  # 9. SEED AUDIT (One-Shot Python Service)
  # ----------------------------------------------------------------------------
  # Phase 4 Task 4.1 support — seeds a valid audit chain for tamper testing.
  # Invoke manually via: docker-compose run --rm seed-audit
  # ----------------------------------------------------------------------------
  seed-audit:
    profiles: ["tools"] # one-shot job: run explicitly, never on `up`
    image: python:3.10-slim
    container_name: kilosunlad-seed-audit
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
    command: bash -c "pip install --no-cache-dir pymongo && python scripts/seed_audit_chain.py"
    networks:
      - kilosunlad-network
    restart: "no"

      # ----------------------------------------------------------------------------
  # 10. AUDIT INTEGRITY (One-Shot Python Service)
  # ----------------------------------------------------------------------------
  # Phase 4 Task 4.2 — audits 6 collections for orphaned references and
  # missing natural keys. Invoke: docker-compose run --rm audit-integrity
  # ----------------------------------------------------------------------------
  audit-integrity:
    profiles: ["tools"] # one-shot job: run explicitly, never on `up`
    image: python:3.10-slim
    container_name: kilosunlad-audit-integrity
    working_dir: /app
    volumes:
      - ./data-pipeline:/app
    command: bash -c "pip install --no-cache-dir pymongo && python scripts/audit_integrity.py"
    networks:
      - kilosunlad-network
    restart: "no"

     # ----------------------------------------------------------------------------
  # 11. RESET DEMO (One-Shot Service)
  # ----------------------------------------------------------------------------
  # Phase 5 Task 5.1 — wipes DB, recreates indexes, re-seeds demo data.
  # Invoke: docker-compose run --rm reset-demo
  # ----------------------------------------------------------------------------
  reset-demo:
    profiles: ["tools"] # one-shot job: run explicitly, never on `up`
    image: docker:cli
    container_name: kilosunlad-reset-demo
    working_dir: /workspace
    volumes:
      - ./data-pipeline:/workspace/data-pipeline
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh /workspace/data-pipeline/scripts/reset_demo.sh
    networks:
      - kilosunlad-network
    restart: "no"

# ------------------------------------------------------------------------------
# SHARED NETWORKS & PERSISTENT VOLUMES
# ------------------------------------------------------------------------------
networks:
  kilosunlad-network:
    driver: bridge

volumes:
  mongo-data:
  upload-data:
  mongo-keyfile-data: